# Copie para config.toml e ajuste. Nenhum segredo aqui: chaves ficam no cofre do sistema.
nome = "Alfred"
pessoa = "Marcos"
idioma = "pt-BR"
tom = "direto e cordial"
modo = "supervisionado"          # observar | supervisionado | liberado
provedor = "groq"                # para voltar ao Claude: provedor = "anthropic" e modelo = "claude-sonnet-5-5" | groq | openai | anthropic | gemini | openrouter | xai | ollama
modelo = ""                      # vazio = padrão do provedor; para OpenAI/Gemini/xAI/OpenRouter/Ollama preencha (veja a lista do dia)
porta = 8765
limite_diario_usd = 0.20         # teto de US$ 5/mês ÷ ~25 dias; o teto real fica no Console da Anthropic

# Grupos de ferramentas sempre ligados (economiza tokens quando vazio). Com cérebro pago/rápido, pode ligar tudo:
# grupos_sempre = ["web", "comunicacao", "criar", "integracoes", "controle"]
grupos_sempre = []

# Pastas onde o Alfred pode ler e escrever (nada fora delas). A primeira é a pasta de trabalho.
pastas = ["~/Alfred-Arquivos", "C:/escritorio-ia/saidas/para-alfred"]

# Comandos que ele pode rodar (sempre com a sua confirmação, sem encadear)
comandos_permitidos = ["git", "python", "python3", "node", "npm", "ls", "dir", "whoami", "date"]

# Agenda: caminho de um .ics exportado (Google/Outlook/Apple). No Mac, vazio lê o app Calendário.
agenda_ics = ""
agendas = ["agenda", "agenda-marcospojr", "agenda-beaesthetic-gmail"]   # endereço secreto iCal de cada uma no cofre: python -m alfred chave <nome> --colar

[claude_code]
limite_dia = 10                  # máximo de chamadas ao Claude Code por dia (uso individual da assinatura)
tempo_max_s = 600                # tempo máximo de cada tarefa, em segundos
consulta_sem_perguntar = true    # true = claude_consultar roda sem pedir o sim, SÓ quando é você pedindo (tela/Telegram). claude_tarefa sempre pergunta.

[tailscale]
ativo = true                     # painel pelo Tailscale (tailscale serve), só para a conta do dono
endereco = "beaesthetic.tail87441b.ts.net"
dono = "marcospojr13@gmail.com"  # a conta do Tailscale que pode abrir o painel

[telegram]
ativo = true                     # token no cofre desde 31/out/2026
dono_id = 7993367327             # seu ID do Telegram (o bot te mostra na primeira mensagem). Só ele é atendido.
avisar_rotinas = true            # o resultado das rotinas (bom-dia etc.) chega no Telegram

[whatsapp]
